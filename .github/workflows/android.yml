name: AJUICE Android
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Bundle Three.js
        run: |
          mkdir -p web/libs/three
          curl -L https://cdn.jsdelivr.net/npm/three@0.173.0/build/three.module.js -o web/libs/three/build-three.module.js
          mkdir -p web/libs/three/build web/libs/three/examples/jsm/controls
          mv web/libs/three/build-three.module.js web/libs/three/build/three.module.js
          curl -L https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/controls/OrbitControls.js -o web/libs/three/examples/jsm/controls/OrbitControls.js
          curl -L https://cdn.jsdelivr.net/npm/three@0.173.0/examples/jsm/controls/TransformControls.js -o web/libs/three/examples/jsm/controls/TransformControls.js
      - name: Prepare assets
        run: bash scripts/prepare_web_assets.sh
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: AJUICE-0.1.0, path: app/build/outputs/apk/debug/app-debug.apk }

# AJUICE build trigger
