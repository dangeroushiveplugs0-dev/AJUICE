name: AJUICE Android
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install web bundler
        run: npm install --no-save three@0.173.0 esbuild
      - name: Bundle AJUICE web app
        run: npx esbuild web/src/main.js --bundle --format=iife --platform=browser --outfile=web/ajui.bundle.js
      - name: Prepare assets
        run: bash scripts/prepare_web_assets.sh
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: AJUICE-0.1.0, path: app/build/outputs/apk/debug/app-debug.apk }

# AJUICE build trigger
